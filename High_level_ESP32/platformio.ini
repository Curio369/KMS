; PlatformIO Configuration for High-Level ESP32 KMS Controller
; SoftAP + Captive Portal + Encrypted UART Bridge

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Filesystem for serving web UI
board_build.filesystem = littlefs

; Libraries
lib_deps =
    ESP Async WebServer
    AsyncTCP

; Serial monitor
monitor_filters = esp32_exception_decoder
